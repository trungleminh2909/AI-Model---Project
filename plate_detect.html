<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>License Plate Recognition</title>
</head>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #eef2f7;
        margin: 0;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 400px;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    h2 {
        color: #34495e;
        margin-bottom: 20px;
        text-align: center;
    }

    label {
        font-weight: bold;
        color: #2c3e50;
        font-size: 16px;
    }

    input[type="text"] {
        width: calc(100% - 20px);
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f9f9f9;
    }

    #video {
        border: 3px solid #2c3e50;
        border-radius: 10px;
        margin: 20px 0;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        align-self: center;
    }

    button {
        padding: 12px;
        width: 100%;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background-color: #3498db;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #2980b9;
    }

    button.danger {
        background-color: #e74c3c;
    }

    button.danger:hover {
        background-color: #c0392b;
    }

    p {
        font-size: 14px;
        color: #555;
        margin: 10px 0;
        text-align: left;
    }

    a.back {
        display: inline-block;
        margin-top: 5px;
        font-size: 14px;
        text-decoration: none;
        color: white;
        background-color: #7f8c8d;
        padding: 8px 16px;
        border-radius: 6px;
        text-align: center;
        transition: background-color 0.3s ease;
    }

    a.back:hover {
        background-color: #616a6b;
    }

    h3 {
        margin-top: 10px;
        color: #34495e;
    }

    canvas {
        display: none;
    }

    .buttons {
        display: flex;
        gap: 10px;
        width: 100%;
        margin-top: 10px;
    }

    .buttons button {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background-color: #3498db;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .buttons button:hover {
        background-color: #2980b9;
    }

    .buttons button.danger {
        background-color: #e74c3c;
    }

    .buttons button.danger:hover {
        background-color: #c0392b;
    }

    .buttons button.success {
        background-color: #3ce74a;
    }

    .buttons button.success:hover {
        background-color: #2daa37;
    }
</style>




<body>
    <h2>Scan Vehicle License Plate</h2>

    <div class="container">
        <h3>Student ID</h3>
        <input type="text" id="student" readonly>
        <a class="back" href="/">Go Back</a>
        
        <h3>Capture & Detect</h3>
        <video id="video" width="400" autoplay></video>

        <p><strong>Instructions:</strong> Hold the license plate clearly facing the webcam. Avoid glare, keep it centered and click "Detect Plate".</p>

        <button onclick="captureAndDetect()">Detect Plate</button>

        <h3>Detected Plate</h3>
        <input type="text" id="plate" readonly>

        <h3>Vehicle Type</h3>
        <div class="buttons">
            <button class="success" onclick="submitEntry()">Enter Vehicle</button>
            <button class="danger" onclick="submitExit()">Exit Vehicle</button>
        </div>        
    </div>

    <canvas id="canvas" width="400" style="display:none;"></canvas>


    <script>

        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const plateInput = document.getElementById("plate");
        const studentInput = document.getElementById("student");

        // Get student ID from query param
        const urlParams = new URLSearchParams(window.location.search);
        studentInput.value = urlParams.get("student") || "";
        
        let backendBaseURL = "";

        fetch("/config")
        .then(res => res.json())
        .then(config => {
            backendBaseURL = `http://${config.BACKEND_IP}:${config.BACKEND_PORT}`;
            console.log(backendBaseURL)
        })
        .catch(err => {
            console.error("Failed to load backend config:", err);
            alert("Could not load server configuration.");
        });

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
        });

        function captureAndDetect() {
            const context = canvas.getContext("2d");
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64 = canvas.toDataURL("image/jpeg").split(',')[1];

            fetch("/detect_base64", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image_data: base64 })
            })
            .then(res => res.json())
            .then(data => {
                plateInput.value = data.plate;
            })
            .catch(error => {
                console.error("Detection failed:", error);
                alert("Could not detect license plate.");
            });
        }

        // function submitEntry() {
        //     const student = studentInput.value;
        //     const bike = plateInput.value;

        //     fetch(`${backendBaseURL}/user/bike_enter`,{
        //         method: "POST",
        //         headers: { "Content-Type": "application/json" },
        //         body: JSON.stringify({ student_id: student, bike: bike })
        //     })
        //     // .then(res => res.json())
        //     .then(async res => {
        //         console.log(res)
        //         if (!res.ok) {
        //             const errorText = await res.text();  // fallback if server doesn't return JSON
        //             throw new Error(`Error ${res.status}: ${errorText}`);
        //         }
        //         return res.json();
        //     })
        //     .then(data => {
        //         alert(`Entry Status:\n- Student ID: ${data.input.student_id}\n- Plate number: ${data.input.bike}`);
        //     })
        //     .catch(async error => {
        //         alert("Entry failed: " + error.message || JSON.stringify(error));
        //     });

        // }
        async function submitEntry() {
            const student = studentInput.value;
            const bike = plateInput.value;

            try {
                const res = await fetch(`${backendBaseURL}/user/bike_enter`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ student_id: student, bike: bike })
                });

                if (!res.ok) {
                    // Try to parse error detail from JSON
                    let errorData;
                    try {
                        errorData = await res.json();
                        if (errorData.detail) {
                            alert("Entry failed: " + errorData.detail);
                        } else {
                            alert("Entry failed: Unexpected server error.");
                        }
                    } catch (e) {
                        // If parsing fails, fallback to raw text
                        const errorText = await res.text();
                        alert("Entry failed: " + errorText);
                    }
                    return;
                }

                // If successful
                const data = await res.json();
                alert("Entry successful!");
                console.log("Entry data:", data);

                window.location.href = "/"

            } catch (err) {
                // Catch network errors
                console.error("Network error:", err);
                alert("Entry failed: Cannot connect to server.");
            }
        }


        async function submitExit() {
            const student = studentInput.value;
            const bike = plateInput.value;

            try {
                const res = await fetch(`${backendBaseURL}/user/bike_exit`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ student_id: student, bike: bike })
                });

                if (!res.ok) {
                    let errorData;
                    try {
                        errorData = await res.json();
                        if (errorData.detail) {
                            alert("Exit failed: " + errorData.detail);
                        } else {
                            alert("Exit failed: Unexpected server error.");
                        }
                    } catch (e) {
                        const errorText = await res.text();
                        alert("Exit failed: " + errorText);
                    }
                    return;
                }

                const data = await res.json();
                alert("Exit successful!");
                console.log("Exit data:", data);

                window.location.href = "/"

            } catch (err) {
                console.error("Network error:", err);
                alert("Exit failed: Cannot connect to server.");
            }
        }

    </script>
</body>
</html>
