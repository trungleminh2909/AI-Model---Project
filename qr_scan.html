<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    #qr-reader {
      width: 400px;
      padding: 15px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .alert {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      display: none;
    }
  </style>


<body>
  <h2>Scan Student QR Code</h2>
  <div id="qr-reader" style="width: 400px;"></div>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      // Redirect to plate detection page with student ID
        const studentList = ["2252000", "2252001", "2252002", "2252003", 
        "2252004", "2252005", "2252006", "2252007", "2252008", "2252009"]
        console.log(typeof(decodedText))
        if (!studentList.includes(decodedText))
            {
                console.log(encodeURIComponent(decodedText))
                alert("This is not a valid student!!!")
                window.location.href = "/";
            }
        else window.location.href = "/plate?student=" + encodeURIComponent(decodedText);
    }

    new Html5Qrcode("qr-reader").start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    ).catch(err => {
      console.error("QR init error:", err);
      alert("QR Scanner init failed.");
    });
  </script>
</body>
</html>
